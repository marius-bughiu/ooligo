[project]
name = "workable-recruiting-gateway"
version = "0.1.0"
description = "Least-privilege MCP gateway in front of Workable's hosted MCP server"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "mcp>=1.9.0",
  "httpx>=0.27.0",
  "pydantic>=2.6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "ruff>=0.4.0",
]

[project.scripts]
workable-gateway = "workable_gateway.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/workable_gateway"]

[tool.ruff]
line-length = 100
target-version = "py311"
