name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A burst of pushes must not queue N full CI runs. Newest push for a given
# branch/PR wins; anything still in flight for the same ref is cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate config + content
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate configuration files
        run: npm run validate:config

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck pipeline
        run: npm run typecheck --workspace=packages/pipeline

  build:
    name: Build site
    # deploy.yml already runs validate + typecheck + build on every push to
    # main, so building here as well burns ~13 min of duplicated compute per
    # push. deploy.yml does NOT run on pull_request, so PRs still get their
    # build from this job -- skipping it entirely would leave a coverage gap.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Astro site
        run: npm run build
        env:
          # Hard requirement: the default heap OOMs at this content volume and
          # the failure presents confusingly as "Cannot find module" on random
          # pages rather than as an out-of-memory error.
          NODE_OPTIONS: --max-old-space-size=8192
