name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Keyed on the ref with cancel-in-progress so a burst of pushes collapses to a
# single deploy of the newest commit. Cloudflare Pages publishes `dist`
# atomically, so an intermediate deploy that never lands costs nothing -- and
# `cancel-in-progress: false` was already producing large clusters of cancelled
# queued runs during high-volume periods.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  # Custom domain ooligo.com is live. Canonical, hreflang, sitemap, OG
  # all use this URL. The pages.dev URL still works as a backup but is
  # not the canonical.
  PUBLIC_SITE_URL: https://ooligo.com

jobs:
  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate config
        run: npm run validate:config

      - name: Typecheck pipeline
        run: npm run typecheck --workspace=packages/pipeline

      - name: Build site
        run: npm run build
        env:
          # Hard requirement: the default heap OOMs at this content volume and
          # the failure presents confusingly as "Cannot find module" on random
          # pages rather than as an out-of-memory error.
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Run from apps/web so wrangler discovers apps/web/functions/
          # (Pages Functions source is resolved relative to the deploy cwd,
          # not nested inside the static output directory.)
          workingDirectory: apps/web
          command: pages deploy dist --project-name=ooligo --branch=main --commit-dirty=true

      - name: Summary
        if: success()
        run: |
          {
            echo "## Deployment"
            echo "- Project: \`ooligo\`"
            echo "- URL: ${{ steps.deploy.outputs.deployment-url }}"
            echo "- Site URL (canonical): \`${PUBLIC_SITE_URL}\`"
            echo "- Branch: \`${GITHUB_REF_NAME}\`"
            echo "- Commit: \`${GITHUB_SHA::7}\`"
          } >> "$GITHUB_STEP_SUMMARY"
