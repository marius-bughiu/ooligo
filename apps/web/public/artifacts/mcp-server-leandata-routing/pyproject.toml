[project]
name = "leandata-routing-mcp"
version = "0.1.0"
description = "Read-only MCP server for LeanData routing audit logs in Salesforce"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "mcp>=1.2.0",
  "httpx>=0.27.0",
  "pydantic>=2.6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-httpx>=0.30.0",
  "ruff>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/leandata_routing_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"
