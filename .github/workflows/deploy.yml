name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Let the active production build publish: generation/refresh commits can
# arrive faster than a full build completes. GitHub's default single pending
# slot keeps only the newest waiting run, without starving the active release.
# The shared ref group still serializes publication to Cloudflare Pages.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  # Custom domain ooligo.com is live. Canonical, hreflang, sitemap, OG
  # all use this URL. The pages.dev URL still works as a backup but is
  # not the canonical.
  PUBLIC_SITE_URL: https://ooligo.com

jobs:
  deploy:
    name: Deploy to Cloudflare Pages
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v5
        with:
          # The IndexNow receipt can predate cancelled deploy runs.
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate config
        run: npm run validate:config

      - name: Typecheck pipeline
        run: npm run typecheck --workspace=packages/pipeline

      - name: Test IndexNow notifications
        run: node --test scripts/indexnow.test.mjs

      - name: Test page metadata
        run: node --import tsx --test apps/web/src/lib/pageMetadata.test.ts

      - name: Test engagement events
        run: node --import tsx --test apps/web/src/lib/engagement.test.ts

      - name: Test internal link selection
        run: node --import tsx --test apps/web/src/lib/relatedLinks.test.ts

      - name: Validate legacy redirects
        run: node --test scripts/legacy-redirects.test.mjs

      - name: Test sitemap dates and groups
        run: node --test apps/web/scripts/sitemap.test.mjs

      - name: Check content links
        run: |
          node --test scripts/check-content-links.test.mjs
          node scripts/check-content-links.mjs

      - name: Build site
        run: npm run build
        env:
          # Hard requirement: the default heap OOMs at this content volume and
          # the failure presents confusingly as "Cannot find module" on random
          # pages rather than as an out-of-memory error.
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Run from apps/web so wrangler discovers apps/web/functions/
          # (Pages Functions source is resolved relative to the deploy cwd,
          # not nested inside the static output directory.)
          workingDirectory: apps/web
          command: pages deploy dist --project-name=ooligo --branch=main --commit-dirty=true

      - name: Restore last accepted IndexNow receipt
        id: indexnow_cache
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: .cache/indexnow/receipt.json
          key: indexnow-v1-main-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            indexnow-v1-main-

      - name: Notify IndexNow of published URL changes
        id: indexnow
        # Publication has already succeeded. A notification outage is reported
        # separately and must not misrepresent the production deployment.
        continue-on-error: true
        run: node scripts/indexnow.mjs submit
        env:
          INDEXNOW_DEPLOY_SUCCESS: ${{ steps.deploy.outcome == 'success' }}

      - name: Save accepted IndexNow receipt
        id: indexnow_save
        if: steps.indexnow.outcome == 'success' && steps.indexnow.outputs.receipt_ready == 'true'
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: .cache/indexnow/receipt.json
          key: indexnow-v1-main-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Summary
        if: success()
        run: |
          {
            echo "## Deployment"
            echo "- Project: \`ooligo\`"
            echo "- URL: ${{ steps.deploy.outputs.deployment-url }}"
            echo "- Site URL (canonical): \`${PUBLIC_SITE_URL}\`"
            echo "- Branch: \`${GITHUB_REF_NAME}\`"
            echo "- Commit: \`${GITHUB_SHA::7}\`"
            echo "- IndexNow step: ${{ steps.indexnow.outcome }}"
            echo "- IndexNow receipt: ${{ steps.indexnow.outputs.status || 'unavailable' }} (${{ steps.indexnow.outputs.url_count || 'unknown' }} planned URLs)"
            echo "- IndexNow receipt cache: ${{ steps.indexnow_save.outcome || 'not needed' }}"
            echo "- IndexNow receipt means notification received, not search indexing confirmed. A notification/cache failure does not undo publication; the next deploy retries from the prior accepted receipt."
          } >> "$GITHUB_STEP_SUMMARY"
