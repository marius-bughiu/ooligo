name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  # Custom domain ooligo.com is live. Canonical, hreflang, sitemap, OG
  # all use this URL. The pages.dev URL still works as a backup but is
  # not the canonical.
  PUBLIC_SITE_URL: https://ooligo.com

jobs:
  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate config
        run: npm run validate:config

      - name: Typecheck pipeline
        run: npm run typecheck --workspace=packages/pipeline

      - name: Build site
        run: npm run build

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/web/dist --project-name=ooligo --branch=main --commit-dirty=true

      - name: Summary
        if: success()
        run: |
          {
            echo "## Deployment"
            echo "- Project: \`ooligo\`"
            echo "- URL: ${{ steps.deploy.outputs.deployment-url }}"
            echo "- Site URL (canonical): \`${PUBLIC_SITE_URL}\`"
            echo "- Branch: \`${GITHUB_REF_NAME}\`"
            echo "- Commit: \`${GITHUB_SHA::7}\`"
          } >> "$GITHUB_STEP_SUMMARY"
